name: Deploy to Azure VM

on:
  push:
    branches:
      - VM

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show current directory
        run: pwd

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        run: mvn clean package

      - name: List build artifacts
        run: ls -la target

      - name: Check WAR file size
        run: du -h target/SpringBootProject.war || true

      - name: Deploy WAR to Azure VM via SCP
        uses: appleboy/scp-action@master  # or try pinning a specific version
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "target/SpringBootProject.war"
          target: "/home/azure/"

      - name: Start Application via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            nohup java -jar /home/azure/SpringBootProject.war > /home/azure/app.log 2>&1 &
